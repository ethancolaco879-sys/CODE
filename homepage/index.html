<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="/largefiles/searcharays.js"></script>
    <script src="https://kit.fontawesome.com/683676ef22.js" crossorigin="anonymous"></script>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sunvista holidays </title>
    <link rel="stylesheet" href="homepage.css">
  </head>
  <body class="antialiased">
    <button class="google-sign-in fixed right-2 top-3 bg-blue-900 text-white p-1 rounded-sm hover:scale-105 active:scale-95 transition-scale duration-250 ease cursor-pointer">Sign In <i class="fa-solid fa-user"></i></button>
    <button class="nav__button cursor-pointer lg:hidden fixed top-1 left-2 z-30 bg-blue-900 rounded-sm p-3 hover:scale-110 transiton-scale duration-250 ease active:scale-95"><i class="fa-solid fa-bars text-white text-4xl"></i></button>
    <nav class="nav ease max-sm:mt-6 transition-transform duration-500 z-20 fixed top-12 left-0 lg:top-0 flex md:flex-row md:gap-1 gap-2 bg-blue-900 md:justify-around w-[25dvw] md:w-full h-max flex-col md:translate-x-0"><a href="#">Home</a><a href="/flightscode/flights.html">Flights</a><a href="#">Hotels</a><a href="/aboutUsCode/aboutUs.html">About Us</a><a href="/contactuscode/ContactUs.html">Contact Us</a></nav>
    <header class="header pt-40 mt-16 lg:mt-12 lg:p-0"><h1 class="text-center text-4xl text-red-700">Sunvista Holidays</h1><h2 class="text-center text-2xl text-red-700">Every horizion, One booking away</h2></header>
    
    <div class="booking flex flex-col bg-blue-400 mx-auto w-max p-3 text-white rounded-lg mt-3">
<div class="booking-flights flex flex-col gap-4">

    <div class="booking-flights__from flex flex-col lg:flex-row">
        <label class="booking-flights__label">Departing from</label>

        <input 
            class="booking-flights__input" 
            placeholder="place, airport"
        >

        <div class="booking-flights__suggestions"></div>
    </div>


    <div class="booking-flights__to flex flex-col">
        <label class="booking-flights__label">Departing to</label>

        <input 
            class="booking-flights__input--to" 
            placeholder="place, airport"
        >

        <div class="booking-flights__suggestions--to"></div>
    </div>


    <div class="booking-flights__date flex gap-3 flex">
        <label class="booking-flights__label">Departing on</label>

        <input 
            type="date" 
            class="booking-flights__input--from-date" 
            required
        >

        <label class="booking-flights__label">Returning on</label>

        <input type="date" class="booking-flights__input--to-date" required>
    </div>
    <div class="booking-hotels">
        <label>Staying at (optional)</label>
        <input class="booking__hotels">
        <label>Nights</label>
        <input class="booking__nights" type="number">
    </div>
</div>
<button class="booking__search-button bg-yellow-500 w-max mx-auto mt-2 p-3 rounded-md font-bold text-black">
    Search<i class="fa-solid fa-magnifying-glass"></i>
</button>
<div class="results"></div>
    </div>
    <script type="module" src="homepage.js"></script>
  </body>
</html>
