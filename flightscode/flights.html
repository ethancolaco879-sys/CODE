<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Colaconest Flights</title>
    <link rel="stylesheet" href="flights.css">
  </head>
  <body>
    <header><h1 class="page-title">Flights</h1></header>
    <nav class="page-navigation">
      <div class="sidebar fixed lg:w-dvw bg-blue-800 lg:h-max text-white flex lg:justify-around flex-col lg:flex-row max-sm:gap-3 max-sm:p-3 rounded-r-lg top-25">
                <a class="home">Home</a>
        <a class="flights" href="flightscode/flights.html">Flights</a>
        <a class="hotels">Hotels</a>
        <a class="about">About Us</a>
        <a class="contact" href="contactuscode/ContactUs.html">Contact Us</a>
      </div>
      <button class="navigation__button transition-scale duration-450 ease hover:scale-110 active:scale-90 bg-blue-800 text-white p-4 text-2xl rounded-xl fixed ml-1"><i class="fa-solid fa-bars "></i></button>
    </nav>
    <main>
        <div class="page-description">
      <p>Colaconest flights: easy, reliable and fast. Just a click away from a dream holiday. Book now.</p>
      </div>
      <div class="booking-flights bg-blue-400 rounded-lg py-3 justify-center lg:flex-row flex-col">
        <div class="booking-flights__from">
          <label class="booking-flights__label">Departing from</label>
        <input class="booking-flights__input bg-blue-600/30" placeholder="place, airport" >
        <div class="booking-flights__suggestions"></div>
        </div>
        <div class="booking-flights__to">
          <label class="booking-flights__label">Departing to</label>
          <input class="booking-flights__input--to" placeholder="place, airport">
          <div class="booking-flights__suggestions--to"></div>
           </div>
           <div class="booking-flights__date">
            <label class="booking-flights__label">Departing on</label>
            <input type="date" class="booking-flights__input--from-date" required>
            <label class="booking-flights__label">Returning on</label>
            <input type="date" class="booking-flights_-input--to-date" required>
           </div>
      </div>
  </main>
    <script src="flights.js"></script>
<script src="https://kit.fontawesome.com/683676ef22.js" crossorigin="anonymous"></script>
  </body>
</html>
